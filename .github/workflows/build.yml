name: Build Windmill

# Builds the Windows installers and the Android app.
# - Every push to main: builds both and keeps them as downloadable workflow artifacts.
# - A tag like v0.1.0, or running it by hand with a release tag: also publishes them on the
#   repository's Releases page (the tag is created if it doesn't exist).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "docs/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (for example v0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm install --no-audit --no-fund

      - name: Build
        run: npx tauri build
        env:
          WINDMILL_GITHUB_CLIENT_ID: ${{ vars.WINDMILL_GITHUB_CLIENT_ID }}

      # A name that never changes, so the website can always link to the latest installer.
      - name: Stable installer name
        shell: bash
        run: cp src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/nsis/Windmill-Windows-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windmill-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners already include the Android SDK and NDK.
      - name: Android NDK
        run: |
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          else
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm install --no-audit --no-fund

      - name: Build
        run: |
          npx tauri android init --ci
          python3 android/patch.py
          npx tauri android build --apk --target aarch64 --target armv7 --ci

      # Sign the release APK. With the ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets set,
      # every build uses your own key (so updates install over each other); without them a
      # one-off key is made for this build.
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ks.jks; PASS="$KEYSTORE_PASSWORD"
          else
            PASS=windmill-build
            keytool -genkeypair -keystore ks.jks -storepass "$PASS" -keypass "$PASS" -alias windmill \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Windmill"
          fi
          mkdir -p out
          APK=$(find src-tauri/gen/android -name "*release-unsigned.apk" -path "*outputs*" | head -1)
          "$BT/zipalign" -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass pass:"$PASS" --ks-key-alias windmill --out out/Windmill-Android.apk aligned.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: windmill-android
          path: desktop/out/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Files to publish
        run: find dist -type f

      - name: Release notes
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          f=".github/release-notes/${TAG}.md"
          { if [ -f "$f" ]; then cat "$f"; echo; fi; cat .github/release-notes/install.md; } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Windmill ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          files: |
            dist/**/Windmill-Windows-Setup.exe
            dist/**/*.msi
            dist/**/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: notes.md
