<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windmill — Preview</title>
<meta name="description" content="A preview of the Windmill desktop app.">
<!-- For the shipped app, bundle these fonts and three.js locally instead of loading them from the web. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Piazzolla:opsz,wght@8..30,400&family=Inter:wght@400;500;600&display=block">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --paper: #ffffff;
  --ink: #141413;
  --blue: #0141FD;
  --blue-rgb: 1, 65, 253;
  --serif: "Piazzolla", "Iowan Old Style", Georgia, serif;
  --sans: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ---------- centre column ---------- */
.center {
  position: absolute; inset: 0; z-index: 1;
  display: grid; place-items: center; align-content: center;
  gap: 4px;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
svg.word { width: min(860px, 92vw); height: auto; overflow: visible; display: block; }
.word text {
  font-family: var(--serif);
  font-size: 200px;
  font-variation-settings: "opsz" 30;
  fill: var(--blue);
}
.core, .sail, .tittle { fill: var(--blue); }
.dot, .mill { transform-box: fill-box; transform-origin: center; }
.dot { transform: scale(0); }
.dot.on { transform: scale(1); }
.mill { transform: scale(0); }
.mill.pop { animation: millpop .15s steps(3, jump-none) forwards; }
.mill .sail { transform-box: view-box; transform-origin: 50px 50px; }
.mill.crush { translate: 0px 0px !important; transition: translate .18s steps(3, jump-none); }
.mill.crush .sail { animation: crush .18s steps(3, jump-none) forwards; }
.spin { transform-box: view-box; animation: tick .3s steps(3, jump-end) 3; }
@keyframes millpop { 0% { transform: scale(0) rotate(-40deg) } 60% { transform: scale(1.2) rotate(8deg) } 100% { transform: scale(1) rotate(0) } }
@keyframes crush   { from { transform: scale(1) } to { transform: scale(0) } }
@keyframes tick    { from { transform: rotate(0deg) } to { transform: rotate(-90deg) } }

/* ---------- Sign in with GitHub ---------- */
.cta-slot { position: relative; height: 60px; display: grid; place-items: center; }
.pill {
  position: relative;
  isolation: isolate;
  appearance: none; border: 0; cursor: pointer;
  height: 54px;
  padding: 0 28px 0 22px;
  border-radius: 999px;
  display: inline-flex; align-items: center; gap: 12px;
  font: 600 15.5px/1 var(--sans);
  letter-spacing: -0.005em;
  color: #fff;
  background: rgb(var(--blue-rgb));
  box-shadow:
    0 1px 2px rgba(var(--blue-rgb), .25),
    0 8px 22px -10px rgba(var(--blue-rgb), .55);
  white-space: nowrap;
  overflow: hidden;
  transition: background .12s steps(2, jump-none), width .2s steps(3, jump-none);
  visibility: hidden;
  clip-path: inset(0 100% 0 0 round 999px);
}
.pill.in {
  visibility: visible;
  animation: wipe .2s steps(3, jump-start) forwards;
}
@keyframes wipe {
  from { clip-path: inset(0 100% 0 0 round 999px); }
  to   { clip-path: inset(0 0 0 0 round 999px); }
}
.pill.done { clip-path: none; }
.pill svg { width: 20px; height: 20px; flex: none; position: relative; z-index: 2; }
.pill .label { position: relative; z-index: 2; text-shadow: 0 1px 0 rgba(0, 20, 90, .18); }

.pill:hover { background: #0036E0; }
.pill:active { transform: scale(.97); }
.pill.loading { padding: 0; gap: 0; justify-content: center; cursor: progress; background: rgb(var(--blue-rgb)); }
.pill.loading .label { display: none; }
.pill .gh { transition: opacity .22s ease, transform .35s cubic-bezier(.3,0,.2,1); }
.pill.loading .gh { width: 20px; height: 20px; }
.pill.done-ok .gh { opacity: 0; transform: scale(.55); }

/* the loader inside the dot */
.pill .ring {
  position: absolute; left: 50%; top: 50%;
  width: 54px; height: 54px; margin: -27px 0 0 -27px;
  opacity: 0; transition: opacity .3s ease;
  pointer-events: none; z-index: 2; overflow: visible;
}
.pill.loading .ring { opacity: 1; transition-delay: .18s; }
.ring circle, .ring path { fill: none; stroke: #fff; stroke-linecap: round; }
.ring circle { stroke-width: 2.2; }
.ring .track { stroke: rgba(255, 255, 255, .2); }
.ring .arc {
  transform-box: fill-box; transform-origin: center;
  stroke-dasharray: 16 132;
  animation: ring-rot 1.15s linear infinite, ring-breathe 1.7s ease-in-out infinite;
  transition: opacity .25s ease;
}
@keyframes ring-rot { to { transform: rotate(360deg); } }
@keyframes ring-breathe {
  0%   { stroke-dasharray: 12 132; stroke-dashoffset: 0; }
  50%  { stroke-dasharray: 62 132; stroke-dashoffset: -18; }
  100% { stroke-dasharray: 12 132; stroke-dashoffset: -120; }
}
.ring .full {
  transform-box: fill-box; transform-origin: center; transform: rotate(-90deg);
  stroke-dasharray: 132; stroke-dashoffset: 132;
  transition: stroke-dashoffset .55s cubic-bezier(.4, 0, .2, 1);
}
.ring .check {
  stroke-width: 2.6; stroke-linejoin: round;
  stroke-dasharray: 24; stroke-dashoffset: 24;
  transition: stroke-dashoffset .45s cubic-bezier(.3, 0, .2, 1) .38s;
}
.pill.done-ok .ring .arc { opacity: 0; }
.pill.done-ok .ring .full { stroke-dashoffset: 0; }
.pill.done-ok .ring .check { stroke-dashoffset: 0; }
.pill.closing {
  transform: scale(0); opacity: 0;
  transition: transform .5s cubic-bezier(.6, -0.28, .74, .05), opacity .3s ease .2s;
}
.cta-slot { transition: height 1s cubic-bezier(.65, 0, .35, 1); }
.cta-slot.gone { height: 0; }
.pill:focus-visible { outline: 2px solid var(--blue); outline-offset: 5px; }

/* ---------- hologram ---------- */
.holo {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: clamp(220px, 37vh, 380px);
  z-index: 0;
  visibility: hidden;
  pointer-events: none;
}
.holo canvas { width: 100%; height: 100%; display: block; }
.holo::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,0) 0 2px, rgba(255,255,255,.4) 2px 3px);
  pointer-events: none;
}
.holo.in { visibility: visible; }

@media (prefers-reduced-motion: reduce) {
  .mill.pop, .mill.crush .sail, .spin, .pill.in { animation: none; }
  .pill.in { clip-path: none; }
}

/* ---------- home: what opens after sign-in ---------- */
.center.leaving { opacity: 0; transition: opacity .9s ease; }
.home { position: absolute; inset: 0; z-index: 2; }
.home[hidden] { display: none; }

/* ======================= liquid glass ======================= */
:root {
  --spring: cubic-bezier(.2, 1.25, .35, 1);
  --spring-soft: cubic-bezier(.25, 1.1, .4, 1);
  --glass-ink: #17181c;
  --glass-sub: #6c707b;
  --blur: 18px;
}
.glass {
  position: relative;
  isolation: isolate;
  background:
    linear-gradient(180deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.34) 100%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(185%) brightness(1.04);
  backdrop-filter: blur(var(--blur)) saturate(185%) brightness(1.04);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(255,255,255,.4),
    inset 0 0 0 .5px rgba(255,255,255,.6),
    inset 0 -10px 18px -12px rgba(var(--blue-rgb), .10),
    0 0 0 .5px rgba(20, 24, 40, .08),
    0 2px 4px -1px rgba(20, 24, 40, .06),
    0 12px 32px -12px rgba(20, 28, 60, .22);
}
.glass.lensed {
  -webkit-backdrop-filter: var(--lens) blur(var(--blur)) saturate(185%) brightness(1.04);
  backdrop-filter: var(--lens) blur(var(--blur)) saturate(185%) brightness(1.04);
}
/* the bevel: a light rim that catches from top-left and bottom-right */
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
  background: linear-gradient(140deg,
    rgba(255,255,255,1) 0%, rgba(255,255,255,.35) 22%, rgba(190,200,225,.25) 50%,
    rgba(255,255,255,.3) 78%, rgba(255,255,255,.95) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  pointer-events: none; z-index: 3;
}
/* the specular: a soft light that follows the pointer */
.glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background:
    radial-gradient(180px 90px at var(--lx, 30%) var(--ly, -20%), rgba(255,255,255,.75), rgba(255,255,255,0) 65%),
    linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 45%);
  mix-blend-mode: soft-light;
  pointer-events: none; z-index: 2;
  opacity: .9; transition: opacity .3s ease;
}

/* ---------- top bar ---------- */
.bar {
  position: absolute; top: max(12px, env(safe-area-inset-top, 0px));
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  pointer-events: none;
}
.capsule {
  display: flex; align-items: center; gap: 2px;
  height: 44px; padding: 4px;
  border-radius: 999px;
  pointer-events: auto;
  opacity: 0; translate: 0 -16px; scale: .96;
  transition: opacity .45s ease, translate .8s var(--spring), scale .8s var(--spring);
}
.bar.in .capsule { opacity: 1; translate: 0 0; scale: 1; }
.bar.in .capsule + .capsule { transition-delay: .08s; }
.item {
  position: relative; z-index: 4;
  appearance: none; border: 0; background: none; cursor: pointer;
  height: 36px; min-width: 36px; padding: 0 11px;
  border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  font: 500 13px/1 var(--sans); letter-spacing: -.005em;
  color: var(--glass-ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  opacity: 0; scale: .6;
  transition: opacity .3s ease calc(var(--i, 0) * 45ms + .18s), scale .6s var(--spring) calc(var(--i, 0) * 45ms + .18s);
}
.bar.in .item { opacity: 1; scale: 1; }
.item.icon { padding: 0; width: 36px; }
.item svg { width: 19px; height: 19px; flex: none; overflow: visible; }
.item .sub { color: var(--glass-sub); }
.item:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
/* the moving lens that slides under whatever you point at */
.bubble {
  position: absolute; z-index: 1; top: 4px; left: 0;
  height: 36px; width: 36px; border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.6));
  box-shadow:
    inset 0 1px 0 #fff,
    inset 0 -1px 1px rgba(255,255,255,.5),
    0 0 0 .5px rgba(20,24,40,.07),
    0 3px 10px -3px rgba(20,28,60,.22);
  opacity: 0; scale: .7;
  transition: translate .5s var(--spring), width .5s var(--spring), opacity .2s ease, scale .4s var(--spring);
  pointer-events: none;
}
.capsule.hot .bubble { opacity: 1; scale: 1; }

/* line icons in the reference style: ink strokes, grey details */
.ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic .soft { stroke: #9aa0ab; }
.ic .softfill { fill: #9aa0ab; stroke: none; }
.ic .fill { fill: currentColor; stroke: none; }

/* ---------- press: Android-style ripple and squish ---------- */
.item.press, .chevron.press { overflow: hidden; }
.tile .rise { position: relative; overflow: hidden; border-radius: inherit; }
.ripple {
  position: absolute; border-radius: 50%; pointer-events: none; z-index: 0;
  width: 10px; height: 10px; margin: -5px 0 0 -5px;
  background: radial-gradient(circle, rgba(var(--blue-rgb), .22) 0%, rgba(var(--blue-rgb), .12) 55%, rgba(var(--blue-rgb), 0) 72%);
  animation: ripple .62s cubic-bezier(.2, .7, .3, 1) forwards;
}
@keyframes ripple { from { transform: scale(0); opacity: 1; } 70% { opacity: .9; } to { transform: scale(var(--rs, 18)); opacity: 0; } }
.press { transition: scale .55s var(--spring) !important; }
.press.down { scale: .88 !important; transition: scale .12s ease-out !important; }

/* ---------- tooltip ---------- */
.tip {
  position: fixed; z-index: 30; left: 0; top: 0;
  height: 28px; padding: 0 11px;
  display: flex; align-items: center;
  border-radius: 999px;
  font: 500 12px/1 var(--sans); color: var(--glass-ink); white-space: nowrap;
  --blur: 14px;
  opacity: 0; scale: .85;
  transition: opacity .16s ease, scale .35s var(--spring);
  pointer-events: none;
}
.tip.on { opacity: 1; scale: 1; }

/* ---------- popover under a top-bar button ---------- */
.pop {
  position: fixed; z-index: 25;
  width: 272px; padding: 16px 18px 17px;
  border-radius: 22px;
  color: var(--glass-ink);
  --blur: 24px;
  transform-origin: var(--ox, 50%) 0;
  opacity: 0; scale: .9; translate: 0 -6px;
  transition: opacity .18s ease, scale .45s var(--spring), translate .45s var(--spring);
  pointer-events: none;
}
.pop.on { opacity: 1; scale: 1; translate: 0 0; pointer-events: auto; }
.pop h3 { margin: 0 0 6px; font: 600 15px/1.25 var(--sans); letter-spacing: -.01em; position: relative; z-index: 4; }
.pop p { margin: 0; font: 400 13px/1.45 var(--sans); color: var(--glass-sub); position: relative; z-index: 4; }
.pop .tag {
  display: inline-block; margin-top: 12px; position: relative; z-index: 4;
  font: 500 10.5px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase;
  color: var(--blue); background: rgba(var(--blue-rgb), .08);
  padding: 5px 8px; border-radius: 999px;
}

/* ---------- the apps button and the dock ---------- */
.dockwrap {
  position: absolute; left: 0; right: 0;
  bottom: max(14px, env(safe-area-inset-bottom, 0px));
  display: grid; justify-items: center; gap: 10px;
  pointer-events: none;
}
.chevron {
  appearance: none; border: 0; cursor: pointer;
  width: 104px; height: 30px; border-radius: 999px;
  display: grid; place-items: center;
  color: var(--glass-ink);
  pointer-events: auto;
  --blur: 14px;
  opacity: 0; translate: 0 22px;
  transition: opacity .4s ease .25s, translate .8s var(--spring) .25s;
  -webkit-tap-highlight-color: transparent;
}
.chevron.in { opacity: 1; translate: 0 0; }
.chevron svg { width: 46px; height: 12px; position: relative; z-index: 4; overflow: visible; transition: rotate .6s var(--spring), translate .4s var(--spring); }
.chevron:hover svg { translate: 0 -2px; }
.chevron[aria-expanded="true"] svg { rotate: 180deg; }
.chevron[aria-expanded="true"]:hover svg { translate: 0 2px; }
.chevron:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

.dock {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 12px;
  border-radius: 28px;
  --blur: 22px;
  transform-origin: 50% 100%;
  opacity: 0; translate: 0 28px; scale: .82;
  visibility: hidden;
  transition: opacity .2s ease, translate .4s cubic-bezier(.5, 0, .75, 0), scale .4s cubic-bezier(.5, 0, .75, 0), visibility 0s linear .4s;
}
.dock.open {
  opacity: 1; translate: 0 0; scale: 1; visibility: visible; pointer-events: auto;
  transition: opacity .22s ease, translate .7s var(--spring-soft), scale .7s var(--spring-soft), visibility 0s;
}
.dock .sep { width: 1px; align-self: stretch; margin: 6px 2px; background: linear-gradient(rgba(20,24,40,0), rgba(20,24,40,.14), rgba(20,24,40,0)); position: relative; z-index: 4; }
.tile {
  --mag: 1;
  position: relative; z-index: 4;
  appearance: none; border: 0; padding: 0; cursor: pointer;
  width: calc(52px * var(--mag)); height: calc(52px * var(--mag));
  border-radius: calc(15px * var(--mag));
  display: grid; place-items: center;
  color: var(--glass-ink);
  background: linear-gradient(180deg, #ffffff, #f2f3f6);
  box-shadow:
    inset 0 1px 0 #fff, inset 0 -1px 0 rgba(20,24,40,.06),
    0 0 0 .5px rgba(20,24,40,.10),
    0 4px 10px -4px rgba(20,28,60,.25);
  transition: width .2s cubic-bezier(.2,.8,.2,1), height .2s cubic-bezier(.2,.8,.2,1), border-radius .2s;
  -webkit-tap-highlight-color: transparent;
}
.tile svg { width: 46%; height: 46%; overflow: visible; }
.tile.brand { background: linear-gradient(180deg, #2a5dff, var(--blue)); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 .5px rgba(1,30,120,.3), 0 6px 14px -6px rgba(var(--blue-rgb), .7); }
.tile .rise {
  display: grid; place-items: center; width: 100%; height: 100%;
  opacity: 0; translate: 0 18px; scale: .7;
  transition: opacity .2s ease, translate .6s var(--spring), scale .6s var(--spring);
  transition-delay: calc(var(--i) * 26ms + 60ms);
}
.dock.open .tile .rise { opacity: 1; translate: 0 0; scale: 1; }
.tile.bounce .rise { animation: bounce .9s cubic-bezier(.3, 0, .3, 1) 2; }
@keyframes bounce { 0%, 100% { translate: 0 0; } 35% { translate: 0 -16px; } 60% { translate: 0 0; } 75% { translate: 0 -4px; } }
.tile::after {
  content: ""; position: absolute; left: 50%; bottom: -7px; width: 4px; height: 4px; margin-left: -2px;
  border-radius: 50%; background: var(--glass-ink); opacity: 0; transition: opacity .3s ease;
}
.tile.running::after { opacity: .55; }

@media (max-width: 640px) {
  .item .hide-sm { display: none; }
  .dock { gap: 6px; padding: 8px 9px; }
  .tile { width: calc(42px * var(--mag)); height: calc(42px * var(--mag)); border-radius: calc(12px * var(--mag)); }
}
@media (prefers-reduced-motion: reduce) {
  .capsule, .item, .chevron, .dock, .tile .rise, .bubble, .pop, .tip { transition: none !important; }
  .tile.bounce .rise, .ripple { animation: none; }
}

.welcome {
  position: absolute; left: 50%; top: 50%;
  width: min(560px, 80vw); height: auto;
  transform: translate(-50%, -50%);
  overflow: visible;
  transition: opacity 1.3s ease, filter 1.3s ease, transform 1.6s cubic-bezier(.2, 0, .1, 1);
}
.welcome text {
  font-family: var(--serif);
  font-size: 120px;
  font-variation-settings: "opsz" 30;
  fill: var(--blue);
}
.welcome.gone { opacity: 0; filter: blur(6px); transform: translate(-50%, calc(-50% - 10px)); }

/* the dots: a small, quiet cluster in the middle */
.cluster {
  position: absolute; left: 50%; top: 50%;
  width: min(360px, 70vw); height: auto;
  transform: translate(-50%, -50%);
  overflow: visible;
  pointer-events: none;
}
.cluster g { animation: drift 160s linear infinite; transform-origin: 0 0; }
.cluster circle {
  fill: var(--blue);
  opacity: 0;
  transition: opacity 1.2s ease;
}
.cluster circle.on { opacity: var(--o); animation: breathe var(--d) ease-in-out var(--delay) infinite; }
@keyframes drift   { to { transform: rotate(360deg); } }
@keyframes breathe { 0%, 100% { opacity: var(--o); } 50% { opacity: calc(var(--o) * .35); } }
@media (prefers-reduced-motion: reduce) {
  .cluster g, .cluster circle.on { animation: none; }
}
</style>
</head>
<body>

<main class="center">
  <svg class="word" id="word" viewBox="0 0 1000 300" role="img" aria-label="Windmill">
    <defs><clipPath id="reveal"></clipPath></defs>
    <text id="text" x="500" y="200" text-anchor="middle" clip-path="url(#reveal)">W&#305;ndm&#305;ll</text>
    <g id="dots"></g>
  </svg>

  <div class="cta-slot" id="slot">
    <button class="pill" id="signin" type="button">
      <svg class="gh" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      <span class="label">Sign in with GitHub</span>
      <svg class="ring" viewBox="0 0 54 54" aria-hidden="true">
        <circle class="track" cx="27" cy="27" r="21"/>
        <circle class="arc" cx="27" cy="27" r="21"/>
        <circle class="full" cx="27" cy="27" r="21"/>
        <path class="check" d="M19.6 27.6 L24.6 32.4 L34.6 21.8"/>
      </svg>
    </button>
  </div>
</main>

<section class="home" id="home" hidden aria-label="Windmill">
  <header class="bar" id="bar">
    <nav class="glass capsule" id="capL" aria-label="Windmill">
      <span class="bubble" aria-hidden="true"></span>

<div class="holo" id="holo" aria-hidden="true"><canvas id="holoCanvas"></canvas></div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const text = $("text"), clip = $("reveal"), dotsG = $("dots"),
        pill = $("signin"), holo = $("holo");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const FONT_PX = 200;
  const BLADE = "50,52 29,9 64,1 60,47";   // one sail of the Windmill mark, in a 100x100 box

  // How each letter is revealed: direction and chunk boundaries.
  const PLAN = [
    ["lr", [.22, .46, .7, 1]], ["bt", [.55, 1]], ["lr", [.38, .7, 1]], ["lr", [.45, .72, 1]],
    ["lr", [.3, .52, .76, 1]], ["bt", [.55, 1]], ["tb", [.5, 1]], ["tb", [.5, 1]],
  ];
  const LETTER_GAP = 95, CHUNK = 60, DOTLESS = [1, 5];

  let rects = [], boxes = [], dots = [], timers = [], tittle = null;
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  // Piazzolla's real i dot, found by diffing "i" against the dotless "ı".
  function measureTittle() {
    const S = 400, c = document.createElement("canvas"); c.width = c.height = S;
    const x = c.getContext("2d", { willReadFrequently: true });
    const draw = ch => {
      x.clearRect(0, 0, S, S);
      x.font = `400 ${FONT_PX}px Piazzolla`; x.fillStyle = "#000";
      x.fillText(ch, 100, 300);
      return x.getImageData(0, 0, S, S).data;
    };
    const a = draw("i"), b = draw("ı");
    let n = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0, minX = S, maxX = 0, minY = S, maxY = 0;
    for (let y = 0; y < S; y++) for (let X = 0; X < S; X++) {
      const k = (y * S + X) * 4 + 3;
      if (a[k] > 128 && b[k] < 40) {
        n++; sx += X; sy += y; sxx += X * X; syy += y * y; sxy += X * y;
        minX = Math.min(minX, X); maxX = Math.max(maxX, X); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
      }
    }
    if (n < 20) return null;
    const cx = sx / n, cy = sy / n;
    const vxx = sxx / n - cx * cx, vyy = syy / n - cy * cy, vxy = sxy / n - cx * cy;
    const h = Math.sqrt(((vxx - vyy) / 2) ** 2 + vxy * vxy);
    return {
      dx: cx - 100, dy: cy - 300,
      rx: Math.sqrt((vxx + vyy) / 2 + h) * 2, ry: Math.sqrt(Math.max((vxx + vyy) / 2 - h, 1)) * 2,
      deg: 0.5 * Math.atan2(2 * vxy, vxx - vyy) * 180 / Math.PI,
      size: Math.max(maxX - minX, maxY - minY),
    };
  }

  function build() {
    clip.innerHTML = ""; dotsG.innerHTML = ""; rects = []; boxes = []; dots = [];
    for (let i = 0; i < text.getNumberOfChars(); i++) {
      const e = text.getExtentOfChar(i);
      const b = { x: e.x - 4, y: e.y - 6, w: e.width + 8, h: e.height + 12 };
      boxes.push(b);
      const r = document.createElementNS(NS, "rect");
      r.setAttribute("x", b.x); r.setAttribute("y", b.y); r.setAttribute("width", 0); r.setAttribute("height", 0);
      clip.appendChild(r); rects.push(r);
    }
    if (!tittle) return;
    DOTLESS.forEach((ci, n) => {
      const p = text.getStartPositionOfChar(ci);
      const g = document.createElementNS(NS, "g");
      g.setAttribute("transform", `translate(${(p.x + tittle.dx).toFixed(2)} ${(p.y + tittle.dy).toFixed(2)})`);
      const dw = document.createElementNS(NS, "g");
      dw.setAttribute("transform", `rotate(${tittle.deg.toFixed(1)})`);
      const dot = document.createElementNS(NS, "ellipse");
      dot.setAttribute("class", "tittle dot");
      dot.setAttribute("rx", tittle.rx.toFixed(2)); dot.setAttribute("ry", tittle.ry.toFixed(2));
      dw.appendChild(dot); g.appendChild(dw);
      let mill = null, spinner = null;
      if (n === 0) {
        const s = (tittle.size * 3.0) / 100;
        mill = document.createElementNS(NS, "g"); mill.setAttribute("class", "mill");
        mill.style.translate = `0px ${(-tittle.size * 0.6).toFixed(2)}px`;
        const scaler = document.createElementNS(NS, "g");
        scaler.setAttribute("transform", `scale(${s.toFixed(3)}) translate(-50 -50)`);
        spinner = document.createElementNS(NS, "g");
        spinner.innerHTML =
          [0, 90, 180, 270].map(a => `<g transform="rotate(${a} 50 50)"><polygon class="sail" points="${BLADE}"/></g>`).join("") +
          `<circle class="core" cx="50" cy="50" r="${(Math.max(tittle.rx, tittle.ry) / s).toFixed(2)}"/>`;
        spinner.style.transformOrigin = "50px 50px";
        scaler.appendChild(spinner); mill.appendChild(scaler); g.appendChild(mill);
      }
      dotsG.appendChild(g);
      dots.push({ dot, mill, spinner });
    });
  }

  function setChunk(i, f) {
    const dir = (PLAN[i] || ["lr"])[0], b = boxes[i], r = rects[i];
    if (dir === "lr") { r.setAttribute("x", b.x); r.setAttribute("y", b.y); r.setAttribute("width", b.w * f); r.setAttribute("height", b.h); }
    if (dir === "bt") { r.setAttribute("x", b.x); r.setAttribute("y", b.y + b.h * (1 - f)); r.setAttribute("width", b.w); r.setAttribute("height", b.h * f); }
    if (dir === "tb") { r.setAttribute("x", b.x); r.setAttribute("y", b.y); r.setAttribute("width", b.w); r.setAttribute("height", b.h * f); }
  }

  // ---------- the intro ----------
  function play() {
    timers.forEach(clearTimeout); timers = [];
    pill.classList.remove("in", "done");
    build();

    later(() => {
      if (reduce) {
        boxes.forEach((_, i) => setChunk(i, 1));
        dots.forEach(d => d.dot.classList.add("on"));
        return outro(200);
      }
      let end = 0;
      PLAN.forEach(([, steps], i) => steps.forEach((f, k) => {
        const at = i * LETTER_GAP + k * CHUNK;
        end = Math.max(end, at);
        later(() => setChunk(i, f), at);
      }));

      const tDots = end + 160;
      dots.forEach((d, n) => later(() => d.dot.classList.add("on"), tDots + n * 70));

      const first = dots[0];
      if (!first || !first.mill) return outro(tDots + 400);
      const tMill = tDots + 650;
      later(() => { first.dot.classList.remove("on"); first.mill.classList.add("pop"); }, tMill);
      later(() => { first.spinner.classList.add("spin"); }, tMill + 260);
      const tBack = tMill + 260 + 3 * 300 + 120;
      later(() => { first.spinner.classList.remove("spin"); first.mill.classList.add("crush"); }, tBack);
      later(() => { first.mill.classList.remove("pop", "crush"); first.dot.classList.add("on"); }, tBack + 180);
      outro(tBack + 180);
    }, 1000);
  }

  function outro(at) {
    later(() => {
      pill.classList.add("in");
      later(() => pill.classList.add("done"), 220);
    }, at + 280);
    later(() => startHologram(), at + 620);
  }

  // ---------- sign in ----------
  // The app shell listens for "windmill:signin" to start the GitHub flow, then dispatches
  // "windmill:signin-success" when it worked, or "windmill:signin-reset" if it failed or was cancelled.
  // When the page finishes its exit, it dispatches "windmill:ready".
  const slot = $("slot");
  let fullWidth = 0;
  pill.addEventListener("click", () => {
    if (pill.classList.contains("loading")) return;
    fullWidth = pill.offsetWidth;
    pill.style.width = fullWidth + "px";
    void pill.offsetWidth;
    pill.classList.add("loading");
    pill.style.width = "54px";
    pill.setAttribute("aria-busy", "true");
    pill.setAttribute("aria-label", "Signing in with GitHub");
    window.dispatchEvent(new CustomEvent("windmill:signin"));
    // Preview only: outside the desktop app there is nobody to answer, so pretend it worked.
    if (!(window.__TAURI__ || window.__TAURI_INTERNALS__ || window.electron))
      setTimeout(() => window.dispatchEvent(new CustomEvent("windmill:signin-success")), 2600);
  });

  window.addEventListener("windmill:signin-reset", () => {
    pill.classList.remove("loading", "done-ok");
    pill.removeAttribute("aria-busy"); pill.removeAttribute("aria-label");
    pill.style.width = fullWidth + "px";
    setTimeout(() => { pill.style.width = ""; }, 220);
  });

  window.addEventListener("windmill:signin-success", () => {
    if (!pill.classList.contains("loading") || pill.classList.contains("done-ok")) return;
    pill.removeAttribute("aria-busy");
    pill.setAttribute("aria-label", "Signed in");
    pill.classList.add("done-ok");                      // ring closes, check draws
    if (holoApi.collapse) holoApi.collapse();           // the field folds away under it
    const quick = reduce ? 0.2 : 1;
    setTimeout(() => pill.classList.add("closing"), 1500 * quick);   // the dot closes
    setTimeout(() => slot.classList.add("gone"), 1850 * quick);      // the name drifts to the centre
    setTimeout(() => window.dispatchEvent(new CustomEvent("windmill:ready")), 2900 * quick);
  });

  // ---------- hologram (three.js): a wireframe field across the bottom, with a pole windmill on it ----------
  let holoStarted = false;
  const holoApi = {};
  function startHologram() {
    if (holoStarted || !window.THREE) return;
    holoStarted = true;
    const T = THREE, BLUE = 0x0141FD;
    const canvas = $("holoCanvas");
    const renderer = new T.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    const scene = new T.Scene();
    scene.fog = new T.Fog(0xffffff, 7, 21);
    const camera = new T.PerspectiveCamera(28, 1, 0.1, 60);
    camera.position.set(0, 1.45, 7);
    camera.lookAt(0, 0.95, 0);
    const render = () => renderer.render(scene, camera);

    const lineMat = (opacity, fog = true) => new T.LineBasicMaterial({ color: BLUE, transparent: true, opacity, fog });
    const fillMat = opacity => new T.MeshBasicMaterial({ color: BLUE, transparent: true, opacity, depthWrite: false, side: T.DoubleSide, fog: false });
    const ground = (x, z) => 0.12 * Math.sin(x * 0.55 + 0.7) + 0.08 * Math.cos(z * 0.9 + x * 0.3) - 0.05;
    const toGeo = list => {
      const arr = new Float32Array(list.length * 6);
      list.forEach((sg, i) => arr.set([...sg[0], ...sg[1]], i * 6));
      const g = new T.BufferGeometry(); g.setAttribute("position", new T.BufferAttribute(arr, 3));
      return g;
    };

    // where the windmill stands (moved with the window's shape in place())
    const site = { x: -6, z: -1.6 };

    // the field: one rolling grid under the whole window
    const X0 = -24, X1 = 24, Z0 = -18, Z1 = 4.2, CELL = 0.6, SUB = 0.2;
    let segs = [], fieldGeo = null, fieldLines = null;
    function buildField() {
      segs = [];
      const P = (x, z) => [x, ground(x, z), z];
      for (let z = Z0; z <= Z1 + 1e-6; z += CELL)
        for (let x = X0; x < X1 - 1e-6; x += SUB) segs.push([P(x, z), P(x + SUB, z), Math.hypot(x + SUB / 2 - site.x, z - site.z)]);
      for (let x = X0; x <= X1 + 1e-6; x += CELL)
        for (let z = Z0; z < Z1 - 1e-6; z += SUB) segs.push([P(x, z), P(x, z + SUB), Math.hypot(x - site.x, z + SUB / 2 - site.z)]);
      segs.sort((a, b) => a[2] - b[2]);
      if (fieldLines) { scene.remove(fieldLines); fieldGeo.dispose(); }
      fieldGeo = toGeo(segs);
      fieldLines = new T.LineSegments(fieldGeo, lineMat(0.5));
      scene.add(fieldLines);
    }

    // the windmill: a slim tapered pole, a nacelle, the Windmill mark as the wheel, and a tail vane
    const mill = new T.Group();
    const pole = new T.Group();
    const H = 2.1, RB = 0.075, RT = 0.034, SIDES = 6, RINGS = [0, 0.5, 1];
    const poleSegs = [];
    const rim = (t, i) => { const r = RB + (RT - RB) * t, a = i / SIDES * Math.PI * 2; return [Math.cos(a) * r, H * t, Math.sin(a) * r]; };
    for (let i = 0; i < SIDES; i++) poleSegs.push([rim(0, i), rim(1, i)]);
    RINGS.forEach(t => { for (let i = 0; i < SIDES; i++) poleSegs.push([rim(t, i), rim(t, (i + 1) % SIDES)]); });
    pole.add(new T.LineSegments(toGeo(poleSegs), lineMat(0.95, false)));
    const poleBody = new T.CylinderGeometry(RT, RB, H, SIDES, 1, true); poleBody.translate(0, H / 2, 0);
    pole.add(new T.Mesh(poleBody, fillMat(0.14)));
    mill.add(pole);

    // footing rings on the ground
    const circle = (r, n = 48) => { const pts = []; for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2; pts.push(new T.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r)); } return new T.BufferGeometry().setFromPoints(pts); };
    const footing = new T.Group();
    footing.add(new T.Line(circle(0.22), lineMat(0.9, false)), new T.Line(circle(0.42), lineMat(0.45, false)));
    footing.position.y = 0.01;
    mill.add(footing);

    const head = new T.Group();
    head.position.y = H + 0.02;
    head.rotation.y = 0.32;
    const nacelleGeo = new T.BoxGeometry(0.15, 0.15, 0.46);
    head.add(new T.Mesh(nacelleGeo, fillMat(0.25)), new T.LineSegments(new T.EdgesGeometry(nacelleGeo), lineMat(1, false)));
    const wheel = new T.Group();
    wheel.position.z = 0.3;
    const pts = BLADE.split(" ").map(p => p.split(",").map(Number)).map(([x, y]) => new T.Vector2((x - 50) / 50, -(y - 50) / 50));
    const bladeGeo = new T.ExtrudeGeometry(new T.Shape(pts), { depth: 0.08, bevelEnabled: false });
    bladeGeo.translate(0, 0, -0.04);
    for (let k = 0; k < 4; k++) {
      const b = new T.Group();
      b.add(new T.Mesh(bladeGeo, fillMat(0.22)), new T.LineSegments(new T.EdgesGeometry(bladeGeo), lineMat(1, false)));
      b.rotation.z = -k * Math.PI / 2;
      wheel.add(b);
    }
    const coreGeo = new T.CylinderGeometry(0.17, 0.17, 0.12, 20); coreGeo.rotateX(Math.PI / 2);
    wheel.add(new T.Mesh(coreGeo, fillMat(0.7)));
    wheel.scale.setScalar(0.56);
    const vane = new T.Shape([new T.Vector2(0, 0.02), new T.Vector2(0.62, 0.2), new T.Vector2(0.62, -0.22), new T.Vector2(0, -0.04)]);
    const vaneGeo = new T.ShapeGeometry(vane); vaneGeo.rotateY(Math.PI / 2); vaneGeo.translate(0, 0, -0.24);
    head.add(wheel, new T.Mesh(vaneGeo, fillMat(0.18)), new T.LineSegments(new T.EdgesGeometry(vaneGeo), lineMat(1, false)));
    mill.add(head);
    scene.add(mill);

    // a ripple that runs out from the foot of the pole now and then
    const pulseMat = lineMat(0, true); pulseMat.depthTest = false;
    const pulse = new T.Line(circle(1, 96), pulseMat);
    scene.add(pulse);

    function place() {
      const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || 260;
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
      const depth = camera.position.z - site.z;
      const halfW = Math.tan(T.MathUtils.degToRad(camera.fov / 2)) * depth * camera.aspect;
      site.x = -halfW * (w < 700 ? 0.62 : 0.7);
      mill.position.set(site.x, ground(site.x, site.z), site.z);
      pulse.position.set(site.x, ground(site.x, site.z) + 0.02, site.z);
      buildField();
    }
    place();
    holo.classList.add("in");

    const showAll = () => { fieldGeo.setDrawRange(0, segs.length * 2); pole.scale.y = 1; head.scale.setScalar(1); footing.scale.setScalar(1); };
    let built = false;
    let collapsed = false, spinTimer = 0, rippleTimer = 0;
    addEventListener("resize", () => { if (collapsed) return; place(); if (built) showAll(); render(); });

    if (reduce) { built = true; showAll(); return render(); }

    // build-up, all in hard steps: the field spreads from the pole, the pole shoots up, the head pops on
    fieldGeo.setDrawRange(0, 0); pole.scale.y = 0; head.scale.setScalar(0); footing.scale.setScalar(0);
    const FIELD_STEPS = 7;
    for (let k = 1; k <= FIELD_STEPS; k++)
      setTimeout(() => { fieldGeo.setDrawRange(0, Math.round(segs.length * 2 * (k / FIELD_STEPS) ** 2)); render(); }, k * 60);
    const tPole = 200;
    [[0.6, 1], [1.25, 1], [0.92, 1]].forEach(([f], i) => setTimeout(() => { footing.scale.setScalar(f === 0.6 ? 0.6 : f > 1 ? 1.2 : 1); render(); }, tPole + i * 45));
    [0.3, 0.62, 1.06, 1].forEach((sy, i) => setTimeout(() => { pole.scale.y = sy; render(); }, tPole + 90 + i * 55));
    const tHead = tPole + 90 + 4 * 55 + 30;
    [1.28, 0.9, 1].forEach((sc, i) => setTimeout(() => { head.scale.setScalar(sc); render(); }, tHead + i * 50));
    setTimeout(() => { built = true; showAll(); render(); }, tHead + 160);

        // a smooth, steady turn
    setTimeout(() => {
      let last = performance.now();
      const turn = now => {
        if (collapsed) return;
        wheel.rotation.z += Math.min(0.05, (now - last) / 1000) * 1.1;
        last = now;
        render();
        requestAnimationFrame(turn);
      };
      requestAnimationFrame(turn);
    }, tHead + 160);

    const ripple = () => {
      [0.5, 1.2, 2.1, 3.2, 4.5, 6].forEach((r, i) => setTimeout(() => {
        pulse.scale.setScalar(r); pulseMat.opacity = 0.75 * (1 - i / 6); render();
      }, i * 80));
      setTimeout(() => { pulseMat.opacity = 0; render(); }, 6 * 80);
    };
    setTimeout(() => { if (!collapsed) { ripple(); rippleTimer = setInterval(ripple, 3800); } }, tHead + 700);
    render();

    // After sign-in: the field draws back into the windmill, then the windmill sinks into the ground. Smooth, unhurried.
    holoApi.collapse = () => {
      if (collapsed) return;
      collapsed = true;
      clearInterval(spinTimer); clearInterval(rippleTimer);
      pulseMat.opacity = 0;
      const total = segs.length * 2, D = reduce ? 1 : 2000, t0 = performance.now();
      const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const frame = now => {
        const p = Math.min(1, (now - t0) / D), e = ease(p);
        fieldGeo.setDrawRange(0, Math.floor(total * (1 - e) / 2) * 2);
        const m = ease(Math.max(0, (p - .3) / .7));
        pole.scale.y = Math.max(1e-3, 1 - m);
        head.position.y = (H + 0.02) * (1 - m);
        head.scale.setScalar(Math.max(1e-3, 1 - m));
        footing.scale.setScalar(Math.max(1e-3, 1 - m));
        wheel.rotation.z += 0.012 * (1 - m);
        render();
        if (p < 1) requestAnimationFrame(frame); else holo.classList.remove("in");
      };
      requestAnimationFrame(frame);
    };
  }

  // ---------- home: blank page, menu, a calm "Welcome", then the dots ----------
  const home = $("home"), centerCol = document.querySelector(".center");
  const wtext = $("wtext"), wclip = $("wclip"), welcome = $("welcome");

  // Reveal any SVG <text> chunk by chunk through a clip path (same idea as the name).
  function reveal(textEl, clipEl, plan, gap, chunk) {
    clipEl.innerHTML = "";
    const bxs = [], rs = [];
    for (let i = 0; i < textEl.getNumberOfChars(); i++) {
      const e = textEl.getExtentOfChar(i);
      const b = { x: e.x - 3, y: e.y - 5, w: e.width + 6, h: e.height + 10 };
      const r = document.createElementNS(NS, "rect");
      r.setAttribute("x", b.x); r.setAttribute("y", b.y); r.setAttribute("width", 0); r.setAttribute("height", 0);
      clipEl.appendChild(r); bxs.push(b); rs.push(r);
    }
    let end = 0;
    plan.forEach(([dir, steps], i) => steps.forEach((f, k) => {
      const at = reduce ? 0 : i * gap + k * chunk;
      end = Math.max(end, at);
      setTimeout(() => {
        const b = bxs[i], r = rs[i];
        if (dir === "lr") { r.setAttribute("x", b.x); r.setAttribute("y", b.y); r.setAttribute("width", b.w * f); r.setAttribute("height", b.h); }
        if (dir === "bt") { r.setAttribute("x", b.x); r.setAttribute("y", b.y + b.h * (1 - f)); r.setAttribute("width", b.w); r.setAttribute("height", b.h * f); }
        if (dir === "tb") { r.setAttribute("x", b.x); r.setAttribute("y", b.y); r.setAttribute("width", b.w); r.setAttribute("height", b.h * f); }
      }, at);
    }));
    return end;
  }

  // ======================= home UI =======================
  const bar = $("bar"), tip = $("tip"), pop = $("pop"), dock = $("dock"), chev = $("chev");

  // a real spring curve, where the browser supports linear()
  (function springs() {
    if (!CSS.supports("transition-timing-function", "linear(0, 1)")) return;
    const curve = (z, w, n = 44) => {
      const wd = w * Math.sqrt(1 - z * z), pts = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        pts.push(i === n ? 1 : +(1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t))).toFixed(4));
      }
      return `linear(${pts.join(", ")})`;
    };
    document.documentElement.style.setProperty("--spring", curve(.58, 13));
    document.documentElement.style.setProperty("--spring-soft", curve(.74, 11));
  })();

  // ---------- lens: real refraction at the glass edges (Chromium, which the desktop app runs on) ----------
  const LENS = !!window.chrome && !reduce;
  const lensDefs = $("lensDefs");
  let lensN = 0;
  function lens(el) {
    if (!LENS) return;
    const w = Math.round(el.offsetWidth), h = Math.round(el.offsetHeight);
    if (!w || !h) return;
    const id = el.dataset.lens || (el.dataset.lens = "lens" + (++lensN));
    const rad = Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0, w / 2, h / 2);
    const bezel = Math.min(18, h * .45);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const cx = c.getContext("2d"), img = cx.createImageData(w, h), d = img.data;
    const hw = w / 2, hh = h / 2;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const dx = x + .5 - hw, dy = y + .5 - hh;
      const qx = Math.abs(dx) - (hw - rad), qy = Math.abs(dy) - (hh - rad);
      let sd, nx, ny;
      if (qx > 0 && qy > 0) { const L = Math.hypot(qx, qy) || 1; sd = L - rad; nx = Math.sign(dx) * qx / L; ny = Math.sign(dy) * qy / L; }
      else if (qx > qy) { sd = qx - rad; nx = Math.sign(dx); ny = 0; }
      else { sd = qy - rad; nx = 0; ny = Math.sign(dy); }
      const inside = Math.max(0, -sd);
      const f = inside < bezel ? (1 - inside / bezel) ** 2 : 0;
      const k = (y * w + x) * 4;
      d[k] = 128 + nx * f * 127; d[k + 1] = 128 + ny * f * 127; d[k + 2] = 128; d[k + 3] = 255;
    }
    cx.putImageData(img, 0, 0);
    let f = document.getElementById(id);
    if (!f) { f = document.createElementNS(NS, "filter"); f.id = id; lensDefs.appendChild(f); }
    f.setAttribute("x", 0); f.setAttribute("y", 0); f.setAttribute("width", w); f.setAttribute("height", h);
    f.setAttribute("filterUnits", "userSpaceOnUse"); f.setAttribute("primitiveUnits", "userSpaceOnUse");
    f.setAttribute("color-interpolation-filters", "sRGB");
    f.innerHTML = `<feImage href="${c.toDataURL()}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="map"/>` +
      `<feDisplacementMap in="SourceGraphic" in2="map" scale="${-Math.min(34, h * .62).toFixed(1)}" xChannelSelector="R" yChannelSelector="G"/>`;
    el.style.setProperty("--lens", `url(#${id})`);
    el.classList.add("lensed");
  }
  const lensAll = () => document.querySelectorAll(".home .glass").forEach(lens);
  let lensT = 0;
  addEventListener("resize", () => { clearTimeout(lensT); lensT = setTimeout(lensAll, 160); });

  // ---------- light: the specular follows the pointer across any glass ----------
  addEventListener("pointermove", e => {
    document.querySelectorAll(".home .glass").forEach(g => {
      const r = g.getBoundingClientRect();
      g.style.setProperty("--lx", `${((e.clientX - r.left) / r.width * 100).toFixed(1)}%`);
      g.style.setProperty("--ly", `${((e.clientY - r.top) / r.height * 100).toFixed(1)}%`);
    });
  }, { passive: true });

  // ---------- press: ripple from the touch point, squish, spring back ----------
  function pressable(el) {
    el.classList.add("press");
    el.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;
      el.classList.add("down");
      const host = el.querySelector(".rise") || el;
      const r = host.getBoundingClientRect();
      const rp = document.createElement("span");
      rp.className = "ripple";
      rp.style.left = `${e.clientX - r.left}px`; rp.style.top = `${e.clientY - r.top}px`;
      rp.style.setProperty("--rs", (Math.hypot(r.width, r.height) / 5).toFixed(1));
      host.appendChild(rp);
      setTimeout(() => rp.remove(), 700);
    });
    const up = () => el.classList.remove("down");
    ["pointerup", "pointerleave", "pointercancel"].forEach(t => el.addEventListener(t, up));
  }
  document.querySelectorAll(".home .item, .home .tile, .home .chevron").forEach(pressable);

  // ---------- the sliding lens under the top-bar buttons ----------
  document.querySelectorAll(".capsule").forEach(cap => {
    const bub = cap.querySelector(".bubble");
    cap.querySelectorAll(".item").forEach(it => it.addEventListener("pointerenter", () => {
      bub.style.translate = `${it.offsetLeft}px 0`;
      bub.style.width = `${it.offsetWidth}px`;
      cap.classList.add("hot");
    }));
    cap.addEventListener("pointerleave", () => cap.classList.remove("hot"));
  });

  // ---------- tooltips ----------
  let tipT = 0, tipFor = null;
  function showTip(el) {
    tipFor = el;
    clearTimeout(tipT);
    tipT = setTimeout(() => {
      if (tipFor !== el || (pop.classList.contains("on") && pop.dataset.for === el.dataset.pop)) return;
      tip.textContent = el.dataset.label;
      const r = el.getBoundingClientRect(), below = r.top < innerHeight / 2;
      const tw = tip.offsetWidth;
      tip.style.left = `${Math.max(8, Math.min(innerWidth - tw - 8, r.left + r.width / 2 - tw / 2))}px`;
      tip.style.top = below ? `${r.bottom + 12}px` : `${r.top - 28 - 12}px`;
      tip.style.transformOrigin = below ? "50% 0" : "50% 100%";
      tip.classList.add("on");
    }, tip.classList.contains("on") ? 0 : 380);
  }
  function hideTip() { tipFor = null; clearTimeout(tipT); tip.classList.remove("on"); }
  document.querySelectorAll(".home [data-label]").forEach(el => {
    el.addEventListener("pointerenter", () => showTip(el));
    el.addEventListener("pointerleave", hideTip);
    el.addEventListener("pointerdown", hideTip);
  });

  // ---------- popovers for Files, Widgets, Phone, Settings ----------
  const POPS = {
    files:    ["Files", "Your folders and files, opened right inside Windmill."],
    widgets:  ["Widgets", "Small cards for the things you check all day."],
    phone:    ["Phone", "Pair your Android phone to use this computer from anywhere."],
    settings: ["Settings", "Wallpaper, which buttons show up, your cursor and more. Same as opening the Windmill app."],
  };
  function closePop() { pop.classList.remove("on"); pop.dataset.for = ""; }
  document.querySelectorAll(".home [data-pop]").forEach(el => el.addEventListener("click", e => {
    e.stopPropagation();
    const key = el.dataset.pop;
    if (pop.dataset.for === key && pop.classList.contains("on")) return closePop();
    closeDock();
    $("popTitle").textContent = POPS[key][0];
    $("popText").textContent = POPS[key][1];
    const r = el.getBoundingClientRect(), pw = 272;
    const left = Math.max(12, Math.min(innerWidth - pw - 12, r.left + r.width / 2 - pw / 2));
    pop.style.left = `${left}px`; pop.style.top = `${r.bottom + 14}px`;
    pop.style.setProperty("--ox", `${r.left + r.width / 2 - left}px`);
    pop.dataset.for = key;
    pop.classList.remove("on"); void pop.offsetWidth;
    pop.classList.add("on");
    lens(pop);
  }));

  // ---------- status: location, weather, volume, time ----------
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "").split("/");
  const city = tz.length > 1 ? tz[tz.length - 1].replace(/_/g, " ") : "";
  if (city) { $("locText").textContent = city; $("locBtn").dataset.label = `${city} (from your time zone)`; }

  const WX = {
    sun:   '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path class="soft" d="M12 3v1.8M12 19.2V21M3 12h1.8M19.2 12H21M5.6 5.6l1.3 1.3M17.1 17.1l1.3 1.3M5.6 18.4l1.3-1.3M17.1 6.9l1.3-1.3"/></svg>',
    part:  '<svg class="ic" viewBox="0 0 24 24"><path class="soft" d="M9 4.2v1.4M3.8 9.4h1.4M5.3 5.7l1 1M12.7 5.7l-1 1"/><path class="soft" d="M6.3 11.4a3.2 3.2 0 0 1 5.6-2.8"/><path d="M8.5 19h9a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6 1.4A2.8 2.8 0 0 0 8.5 19z"/></svg>',
    cloud: '<svg class="ic" viewBox="0 0 24 24"><path d="M7.5 18.5h10a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.8 1.6A3.2 3.2 0 0 0 7.5 18.5z"/></svg>',
    rain:  '<svg class="ic" viewBox="0 0 24 24"><path d="M7.5 15h10a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.8 1.6A3.2 3.2 0 0 0 7.5 15z"/><path class="soft" d="M9 17.5l-1 2.5M13 17.5l-1 2.5M17 17.5l-1 2.5"/></svg>',
    snow:  '<svg class="ic" viewBox="0 0 24 24"><path d="M7.5 15h10a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.8 1.6A3.2 3.2 0 0 0 7.5 15z"/><g class="softfill"><circle cx="9" cy="19" r="1"/><circle cx="13" cy="20" r="1"/><circle cx="17" cy="19" r="1"/></g></svg>',
  };
  $("wxIcon").innerHTML = WX.part;
  (async () => {
    if (!city) return;
    try {
      const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`)).json();
      const pl = g.results && g.results[0]; if (!pl) return;
      const fahrenheit = /-(US|LR|MM)\b/.test(navigator.language || "");
      const f = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pl.latitude}&longitude=${pl.longitude}&current=temperature_2m,weather_code&timezone=auto${fahrenheit ? "&temperature_unit=fahrenheit" : ""}`)).json();
      const t = Math.round(f.current.temperature_2m), code = f.current.weather_code;
      const [kind, word] = code === 0 ? ["sun", "Clear"] : code <= 2 ? ["part", "Partly cloudy"] : code <= 48 ? ["cloud", code === 3 ? "Cloudy" : "Fog"]
        : (code >= 71 && code <= 77) || code === 85 || code === 86 ? ["snow", "Snow"] : ["rain", code >= 95 ? "Storms" : "Rain"];
      $("wxIcon").innerHTML = WX[kind];
      $("wxText").textContent = `${t}°`;
      $("wxBtn").dataset.label = `${word}, ${t}° in ${pl.name}`;
    } catch (e) { /* offline: the icon stays, no number */ }
  })();

  let vol = 60, muted = false;
  function paintVol() {
    const lvl = muted ? 0 : vol;
    $("w1").style.display = lvl > 0 ? "" : "none";
    $("w2").style.display = lvl > 50 ? "" : "none";
    $("mute").style.display = lvl === 0 ? "" : "none";
    $("volBtn").dataset.label = muted ? "Muted" : `Volume ${vol}%`;
    if (tipFor === $("volBtn")) tip.textContent = $("volBtn").dataset.label;
  }
  $("volBtn").addEventListener("click", () => { muted = !muted; paintVol(); });
  $("volBtn").addEventListener("wheel", e => {
    e.preventDefault(); muted = false;
    vol = Math.max(0, Math.min(100, vol + (e.deltaY < 0 ? 5 : -5)));
    paintVol(); showTip($("volBtn"));
  }, { passive: false });
  paintVol();

  function paintTime() {
    const now = new Date();
    $("dateText").textContent = now.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
    $("timeText").textContent = now.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    $("timeBtn").dataset.label = now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }
  paintTime();
  setTimeout(() => { paintTime(); setInterval(paintTime, 60000); }, (60 - new Date().getSeconds()) * 1000);

  // ---------- the dock ----------
  const tiles = [...dock.querySelectorAll(".tile")];
  function openDock() {
    closePop(); hideTip();
    dock.classList.add("open");
    chev.setAttribute("aria-expanded", "true");
    chev.dataset.label = "Hide apps";
    requestAnimationFrame(() => lens(dock));
  }
  function closeDock() {
    dock.classList.remove("open");
    chev.setAttribute("aria-expanded", "false");
    chev.dataset.label = "Apps";
    tiles.forEach(t => t.style.setProperty("--mag", 1));
  }
  chev.addEventListener("click", e => { e.stopPropagation(); dock.classList.contains("open") ? closeDock() : openDock(); });
  dock.addEventListener("click", e => e.stopPropagation());
  pop.addEventListener("click", e => e.stopPropagation());
  $("home").addEventListener("click", () => { closePop(); closeDock(); });
  addEventListener("keydown", e => { if (e.key === "Escape") { closePop(); closeDock(); } });

  // magnify toward the pointer, like a Mac dock
  if (!reduce) {
    dock.addEventListener("pointermove", e => {
      tiles.forEach(t => {
        const r = t.getBoundingClientRect();
        const k = Math.max(0, 1 - Math.abs(e.clientX - (r.left + r.width / 2)) / 150);
        t.style.setProperty("--mag", (1 + .42 * k * k).toFixed(3));
      });
    });
    dock.addEventListener("pointerleave", () => tiles.forEach(t => t.style.setProperty("--mag", 1)));
  }
  // opening an app: it bounces, then shows it is running
  tiles.forEach(t => t.addEventListener("click", () => {
    if (t.classList.contains("running")) return;
    t.classList.remove("bounce"); void t.offsetWidth; t.classList.add("bounce");
    setTimeout(() => { t.classList.remove("bounce"); t.classList.add("running"); }, 1800);
  }));

  function buildMenu() {
    bar.classList.add("in");
    chev.classList.add("in");
    setTimeout(lensAll, 900);
  }

  function seedCluster() {
    const g = $("clusterG"); g.innerHTML = "";
    const N = 46, R = 150, GOLD = Math.PI * (3 - Math.sqrt(5));
    const dots = [];
    for (let i = 1; i <= N; i++) {
      const r = R * Math.sqrt(i / N), a = i * GOLD;
      const c = document.createElementNS(NS, "circle");
      const jitter = 6 * Math.sin(i * 12.9898);
      c.setAttribute("cx", ((r + jitter) * Math.cos(a)).toFixed(1));
      c.setAttribute("cy", ((r + jitter) * Math.sin(a)).toFixed(1));
      c.setAttribute("r", (1.2 + 2.4 * (1 - i / N) * (0.6 + 0.4 * Math.abs(Math.sin(i * 7.31)))).toFixed(2));
      c.style.setProperty("--o", (0.25 + 0.6 * (1 - i / N)).toFixed(2));
      c.style.setProperty("--d", (4 + (i % 5)) + "s");
      c.style.setProperty("--delay", (-(i % 7) * 0.7) + "s");
      g.appendChild(c); dots.push(c);
    }
    dots.forEach((c, i) => setTimeout(() => c.classList.add("on"), reduce ? 0 : i * 45));
  }

  window.addEventListener("windmill:ready", () => {
    centerCol.classList.add("leaving");                 // the name fades, leaving a blank white page
    setTimeout(() => {
      centerCol.hidden = true;
      home.hidden = false;
      setTimeout(buildMenu, 500);                        // the buttons load
      setTimeout(() => {                                 // a calm "Welcome", chunk by chunk
        const end = reveal(wtext, wclip, [
          ["lr", [.3, .6, 1]], ["lr", [.5, 1]], ["tb", [.5, 1]], ["lr", [.5, 1]],
          ["lr", [.5, 1]], ["lr", [.35, .7, 1]], ["lr", [.5, 1]],
        ], 150, 120);
        setTimeout(() => {                               // it leaves softly
          welcome.classList.add("gone");
          setTimeout(seedCluster, 1100);                 // then the dots, so nothing overlaps
        }, end + 1500);
      }, 1100);
    }, 1000);
  });

  // ---------- go ----------
  Promise.race([
    Promise.all([
      document.fonts.load(`400 ${FONT_PX}px "Piazzolla"`, "Windmillı"),
      document.fonts.load('600 16px "Inter"', "Sign in with GitHub"),
    ]),
    new Promise(r => setTimeout(r, 4000)),
  ]).then(() => {
    tittle = measureTittle();
    if (!tittle) text.textContent = "Windmill";
    play();
  });

  // Press R to replay while working on the intro.
  addEventListener("keydown", e => { if (e.key === "r" || e.key === "R") location.reload(); });
})();
</script>
</body>
</html>
